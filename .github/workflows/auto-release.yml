name: Auto Build Metrolist Island

on:
  schedule:
    - cron: '*/15 * * * *' # Проверка каждые 15 минут
  workflow_dispatch: # Ручной запуск

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    strategy:
      matrix:
        include:
          - variant: foss
            variantName: Foss
            fileSuffix: "Metrolist-Island"
          - variant: gms
            variantName: Gms
            fileSuffix: "Metrolist-Island-GMS"

    steps:
      - name: Checkout Fork Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Check Upstream Release
        id: check_release
        run: |
          RESPONSE=$(curl -s https://api.github.com/repos/metrolistGroup/metrolist/releases/latest)
          UPSTREAM_TAG=$(echo "$RESPONSE" | jq -r .tag_name)
          echo "$RESPONSE" | jq -r .body > release_notes.txt
          
          echo "Upstream release tag: $UPSTREAM_TAG"
          MY_TAG=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/${{ github.repository }}/releases/latest | jq -r .tag_name)
          echo "My fork release tag: $MY_TAG"

          if [ "$UPSTREAM_TAG" != "null" ] && [ "$UPSTREAM_TAG" != "" ] && [ "$UPSTREAM_TAG" != "$MY_TAG" ]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "tag=$UPSTREAM_TAG" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "tag=${UPSTREAM_TAG:-v1.0.0}" >> $GITHUB_OUTPUT
          else
            echo "should_build=false" >> $GITHUB_OUTPUT
          fi

      - name: Sync with Upstream
        if: steps.check_release.outputs.should_build == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/metrolistGroup/metrolist.git || true
          git fetch upstream
          git checkout main || git checkout master
          git merge upstream/main --allow-unrelated-histories -X theirs || git merge upstream/master --allow-unrelated-histories -X theirs

      # ПОДМЕНА ССЫЛОК В КОДЕ
      - name: Patch Updater and Resources for Fork
        if: steps.check_release.outputs.should_build == 'true'
        run: |
          sed -i 's|https://api.github.com/repos/MetrolistGroup/Metrolist|https://api.github.com/repos/${{ github.repository }}|g' app/src/main/kotlin/com/metrolist/music/utils/Updater.kt || true
          sed -i 's|https://api.github.com/repos/metrolistGroup/metrolist|https://api.github.com/repos/${{ github.repository }}|g' app/src/main/kotlin/com/metrolist/music/utils/Updater.kt || true
          sed -i 's|https://github.com/MetrolistGroup/Metrolist/releases|https://github.com/${{ github.repository }}/releases|g' app/src/main/res/values*/strings*.xml || true

      - name: Set up JDK 21
        if: steps.check_release.outputs.should_build == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set Up Gradle
        if: steps.check_release.outputs.should_build == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        if: steps.check_release.outputs.should_build == 'true'
        run: chmod +x gradlew

      - name: Build Release APKs with Custom Application Name
        if: steps.check_release.outputs.should_build == 'true'
        run: ./gradlew --console=plain assemble${{ matrix.variantName }}Release --warning-mode summary
        env:
          METROLIST_APPLICATION_ID: com.apple.android.music
          METROLIST_APP_NAME: "Metrolist (i)"

      # ПОДПИСЬ APK ФАЙЛА ПОСТОЯННЫМ КЛЮЧОМ
      - name: Sign APK File
        if: steps.check_release.outputs.should_build == 'true' && secrets.SIGNING_KEY != ''
        run: |
          OUTPUT_DIR="app/build/outputs/apk/${{ matrix.variant }}/release"
          APK_FILE=$(find "$OUTPUT_DIR" -name "*.apk" | head -n 1)

          # Декодируем .jks файл из секретов
          echo "${{ secrets.SIGNING_KEY }}" | base64 -d > release.jks

          # Находим apksigner и zipalign в Android SDK
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          
          # Выравниваем APK (zipalign)
          $BUILD_TOOLS_DIR/zipalign -v -p 4 "$APK_FILE" "$OUTPUT_DIR/aligned.apk"

          # Подписываем постоянным ключом
          $BUILD_TOOLS_DIR/apksigner sign \
            --ks release.jks \
            --ks-pass pass:"${{ secrets.KEY_STORE_PASSWORD }}" \
            --ks-key-alias "${{ secrets.ALIAS }}" \
            --key-pass pass:"${{ secrets.KEY_PASSWORD }}" \
            --out "$OUTPUT_DIR/signed.apk" \
            "$OUTPUT_DIR/aligned.apk"

          # Заменяем оригинальный файл подписанным
          mv "$OUTPUT_DIR/signed.apk" "$APK_FILE"
          rm -f release.jks "$OUTPUT_DIR/aligned.apk"

      - name: Prepare APK File for Release
        if: steps.check_release.outputs.should_build == 'true'
        run: |
          OUTPUT_DIR="app/build/outputs/apk/${{ matrix.variant }}/release"
          mkdir -p "out"
          
          APK_FILE=$(find "$OUTPUT_DIR" -name "*.apk" | head -n 1)
          cp "$APK_FILE" "out/${{ matrix.fileSuffix }}-${{ steps.check_release.outputs.tag }}.apk"

      - name: Publish Release to Fork
        if: steps.check_release.outputs.should_build == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ steps.check_release.outputs.tag }}"
          name: "Metrolist Island ${{ steps.check_release.outputs.tag }}"
          body_path: release_notes.txt
          files: out/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
